[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redclaw"
version = "0.1.0"
description = "Adversarial AI Agent Red Team Framework — AATCK-based security assessment for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Bedrettin Cakmak", email = "88455041+bedo8@users.noreply.github.com"},
]
keywords = ["ai-security", "red-team", "agent-testing", "aatck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
openclaw = [
    "websockets>=12.0",
    "cryptography>=42.0.0",
]
dashboard = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
redclaw = "redclaw.cli:app"

[tool.setuptools.packages.find]
include = ["redclaw*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
