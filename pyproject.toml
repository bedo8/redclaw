[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redclaw"
dynamic = ["version"]
description = "Adversarial red-team framework for AI agents, built on the AATCK taxonomy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Bedrettin Cakmak"}]
keywords = ["ai-security", "red-team", "agent-testing", "aatck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anthropic>=1.0,<2",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "loguru>=0.7.2,<0.8",
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=13.7,<16",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
openclaw = [
    "cryptography>=46.0.7,<51",
    "websockets>=13,<18",
]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=2.0,<3",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.17,<0.18",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
redclaw = "redclaw.cli:app"

[project.urls]
Homepage = "https://github.com/bedo8/redclaw"
Issues = "https://github.com/bedo8/redclaw/issues"
Source = "https://github.com/bedo8/redclaw"

[tool.setuptools.packages.find]
include = ["redclaw*"]

[tool.setuptools.package-data]
"redclaw.campaigns" = ["*.yaml"]
"redclaw.reporting" = ["templates/*.j2", "templates/*.html"]

[tool.setuptools_scm]
version_file = "redclaw/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=redclaw",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = ["redclaw/_version.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S", "RUF100"]
ignore = [
    "S101",  # assert is fine in tests and type-narrowing
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S310", "S314", "S603", "S607"]
# Mutation variety is not a security control; the stdlib PRNG is the right tool.
"redclaw/payloads/mutations.py" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options through default values.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["redclaw"]
