# Pre-commit hooks for RedClaw.
# Install: pip install pre-commit && pre-commit install
# Manual run on all files: pre-commit run --all-files
#
# Hooks are pinned to specific revs for reproducibility; bump via
# `pre-commit autoupdate` when CVEs or major improvements land.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "types-PyYAML>=6.0"
          - "pydantic>=2.5"
        args: ["--config-file=pyproject.toml"]
        files: ^redclaw/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '\.mypy_cache|\.ruff_cache|\.pytest_cache|\.git/|reports/|egg-info|\.coverage'
