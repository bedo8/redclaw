# Pre-commit hooks for RedClaw.
# Install: pip install pre-commit && pre-commit install
# Manual run on all files: pre-commit run --all-files
# Bump revs with `pre-commit autoupdate`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "types-PyYAML>=6.0.12"
          - "pydantic>=2.7,<3"
          - "pydantic-settings>=2.4,<3"
        args: ["--config-file=pyproject.toml"]
        files: ^redclaw/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '\.mypy_cache|\.ruff_cache|\.pytest_cache|\.git/|reports/|egg-info|\.coverage|requirements\.lock|tests/data/'
