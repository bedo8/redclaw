name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual dry run (builds, never releases)

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm reads git tags
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2,<2" "twine>=6,<7"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Check the wheel ships campaigns and templates
        run: |
          python -m zipfile -l dist/*.whl | grep -q "redclaw/campaigns/quick_prompt_injection.yaml"
          python -m zipfile -l dist/*.whl | grep -q "redclaw/reporting/templates/report.html.j2"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redclaw-dist
          path: dist/*
          retention-days: 14

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Configure the matching trusted publisher at
    # https://pypi.org/manage/project/redclaw/settings/publishing/
    # (owner bedo8, repo redclaw, workflow build.yml, environment pypi).
    environment:
      name: pypi
      url: https://pypi.org/p/redclaw
    permissions:
      id-token: write # OIDC token for trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redclaw-dist
          path: dist

      - name: Publish to PyPI
        # Mints a short-lived OIDC token (no stored secret) and generates PEP 740
        # Sigstore attestations for each artifact (attestations default to true).
        # Not SHA-pinned on purpose: this action pulls a prebuilt image tagged
        # by the ref it is invoked with, and pypa publishes images only for
        # release tags (a SHA pin fails with "manifest unknown").
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  release:
    name: attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redclaw-dist
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          generate_release_notes: true
