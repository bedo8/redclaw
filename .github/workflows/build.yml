name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual dry run (builds, never releases)

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # setuptools-scm reads git tags
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2,<2" "twine>=6,<7"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Check the wheel ships campaigns and templates
        run: |
          python -m zipfile -l dist/*.whl | grep -q "redclaw/campaigns/quick_prompt_injection.yaml"
          python -m zipfile -l dist/*.whl | grep -q "redclaw/reporting/templates/report.html.j2"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redclaw-dist
          path: dist/*
          retention-days: 14

  release:
    name: attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redclaw-dist
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          generate_release_notes: true
