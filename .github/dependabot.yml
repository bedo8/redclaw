version: 2

updates:
  # Python dependencies declared in pyproject.toml.
  # requirements.lock is regenerated by hand after merging (see CONTRIBUTING.md).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(dev-deps)"
    groups:
      patch-updates:
        update-types:
          - "patch"

  # GitHub Actions used by .github/workflows/*.yml (pinned by SHA).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
